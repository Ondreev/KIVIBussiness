<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KIVI · Ценники и этикетки</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 9h8l7 7-6 6-7-7z' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linejoin='round'/%3E%3Ccircle cx='13' cy='13' r='1.4' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f5f8; --card:#fff; --ink:#14161c; --muted:#6b7280; --line:#e4e7ee; --line2:#d3d8e3;
  --acc:#4f46e5; --acc-ink:#fff; --acc-soft:#eef0ff; --ok:#0f9d58; --ok-soft:#e6f6ee; --warn:#b45309; --warn-soft:#fff4e0;
  --bad:#d93025; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06); --r:12px;
  --tagbg:#e9ebf2;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --card:#181b22; --ink:#eceef3; --muted:#9aa3b2; --line:#272c36; --line2:#363c49;
    --acc:#7c83ff; --acc-ink:#0b0d14; --acc-soft:#232650; --ok:#4cd08a; --ok-soft:#16301f; --warn:#f2b35c; --warn-soft:#352915;
    --bad:#ff6b61; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); --tagbg:#10131a;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
.hide{display:none!important}

/* ---------- каркас ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--acc);display:grid;place-items:center;color:var(--acc-ink)}
.brand small{font-weight:500;color:var(--muted);font-size:12px;display:block;margin-top:-2px}
.nav{display:flex;gap:4px;margin-left:8px}
.nav button{border:0;background:none;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
.nav button:hover{background:var(--acc-soft);color:var(--ink)}
.nav button.on{background:var(--acc-soft);color:var(--acc)}
.top .sp{flex:1}
.save-state{font-size:12px;color:var(--muted)}
.save-state.warn{color:var(--bad);font-weight:600}
.wrap{max-width:1180px;margin:0 auto;padding:24px 24px 60px}
.banner{background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:13px}

/* ---------- кнопки/поля ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;white-space:nowrap;transition:.12s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.pri:hover{filter:brightness(1.08);color:var(--acc-ink)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--acc-soft)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:16px;height:16px;flex:none}
.inp,.sel,.txa{border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:8px 10px;width:100%;outline:none}
.inp:focus,.sel:focus,.txa:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.txa{resize:vertical;min-height:70px;font-family:inherit}
.inp.num{width:96px;text-align:right}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line2);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.chk{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.chk input{width:16px;height:16px;accent-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--line);color:var(--muted);border:0;cursor:pointer}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* ---------- позиции ---------- */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.bar .grow{flex:1;min-width:180px}
.search{position:relative;flex:1;min-width:200px;max-width:380px}
.search input{padding-left:34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.selbar{display:flex;gap:10px;align-items:center;padding:9px 14px;background:var(--acc-soft);border-radius:10px;margin-bottom:12px;font-weight:600}
.tbl-wrap{overflow:auto;max-height:calc(100vh - 330px)}
table{width:100%;border-collapse:separate;border-spacing:0}
th{position:sticky;top:0;background:var(--card);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2;cursor:default}
th.srt{cursor:pointer}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:color-mix(in srgb,var(--acc-soft) 45%,transparent)}
tr.printed td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
tr.printed .nm{color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.nm b{font-weight:600}
.nm small{display:block;color:var(--muted);font-size:12px}
.itemno{font-weight:700;font-variant-numeric:tabular-nums}
.price{font-weight:700;font-variant-numeric:tabular-nums}
.old{color:var(--muted);text-decoration:line-through;font-size:12px;margin-left:4px;font-weight:400}
.acts{display:flex;gap:6px;justify-content:flex-end}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px;font-size:18px}
.more{padding:12px;text-align:center}
.bcwarn{color:var(--bad);font-size:12px;font-weight:600}

/* ---------- макеты ---------- */
.lay{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:20px;align-items:start}
.lay-pv{position:sticky;top:76px;padding:16px}
.pv-stage{background:var(--tagbg);border-radius:10px;min-height:260px;display:grid;place-items:center;padding:22px;overflow:auto;margin:12px 0}
.pvwrap{position:relative;box-shadow:0 2px 14px rgba(0,0,0,.22);background:#fff;flex:none}
.pvscale{position:absolute;left:0;top:0;transform-origin:0 0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.fld label.l{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.fld .unit{color:var(--muted);font-size:12px;margin-left:6px}
.fld.full{grid-column:1/-1}
.grp{padding:16px;margin-bottom:14px}
.grp h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.grp h3 .chk{margin-left:auto;font-weight:500;font-size:13px}
.blk-off .fgrid{opacity:.45}
.row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.zoom{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.zoom input{flex:1;accent-color:var(--acc)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5}
.hint b{color:var(--ink)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* ---------- модалки ---------- */
.ov{position:fixed;inset:0;background:rgba(10,12,18,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto;backdrop-filter:blur(2px)}
.modal{background:var(--card);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:100%;max-width:940px;display:flex;flex-direction:column;max-height:92vh}
.modal.sm{max-width:560px}
.mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.mh h2{font-size:17px;flex:1}
.mb{padding:18px 20px;overflow:auto;flex:1}
.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.mf .sp{flex:1}
.x{border:0;background:none;cursor:pointer;font-size:22px;line-height:1;color:var(--muted);padding:4px 8px;border-radius:8px}
.x:hover{background:var(--line)}
.pgrid{display:grid;grid-template-columns:1fr 300px;gap:20px}
.lines{display:flex;flex-direction:column;gap:6px;max-height:48vh;overflow:auto;padding-right:4px}
.ln{display:grid;grid-template-columns:1fr 84px 30px;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:10px}
.ln .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .t small{color:var(--muted)}
.ln.done{background:var(--ok-soft)}
.qbig{font-size:30px;font-weight:800;text-align:center;width:150px;padding:12px;border-radius:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.single{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.tot{font-weight:700}
.maptbl{font-size:12.5px;margin-top:10px}
.maptbl th{position:static;background:var(--bg);padding:6px}
.maptbl td{padding:5px 8px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.maptbl select{padding:4px 6px;font-size:12px;border-radius:7px}

.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.35);display:flex;gap:14px;align-items:center;font-weight:500}
.toast button{border:0;background:none;color:var(--acc);font-weight:700;cursor:pointer;padding:0;filter:brightness(1.4)}

/* ---------- печатная форма (на экране скрыта за пределами окна, но вёрстка считается) ---------- */
#printRoot{position:absolute;left:-99999px;top:0;background:#fff;color:#000}
.tag{display:flex;flex-direction:column;box-sizing:border-box;overflow:hidden;background:#fff;color:#000;position:relative;line-height:1.15}
.tag .blk{flex:none;width:100%;white-space:nowrap;overflow:visible}
.tag .t{overflow:hidden}
.tag .wrap2{white-space:normal;word-break:break-word}
.tag .b-price{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tag .pr{display:inline-flex;align-items:flex-start;line-height:.88;white-space:nowrap}
.tag .pr-n{font-variant-numeric:tabular-nums}
.tag .pr-s{font-size:.34em;line-height:1;margin-left:.08em;padding-top:.12em;font-weight:inherit}
.tag .pr-k{display:flex;flex-direction:column;align-items:flex-start;margin-left:.06em;padding-top:.08em;line-height:1}
.tag .pr-k b{font-size:.36em;font-weight:inherit;line-height:.95}
.tag .pr-k i{font-size:.2em;font-style:normal;font-weight:inherit;margin-top:.3em;line-height:1}
.tag .pr-u{font-size:.22em;margin-left:.2em;align-self:flex-end;padding-bottom:.1em;font-weight:inherit;line-height:1}
.tag .oldp{text-decoration:line-through;text-align:center;font-weight:600}
.tag .bcbar{display:flex;justify-content:center}
.tag .bcbar svg{display:block}
.tag .hrt{text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.06em}
.tag .promo-row{display:flex;gap:2mm;align-items:center;width:100%;flex:none}
.tag .promo-row svg{flex:none;display:block}
.tag .promo-row .ptxt{flex:1;min-width:0;white-space:normal;hyphens:auto}
.tag .bar-err{font-size:6pt;color:#b00;white-space:normal}
.pg{break-after:page;page-break-after:always;overflow:hidden;position:relative;background:#fff}
.pg:last-child{break-after:auto;page-break-after:auto}
.pg .rot{position:absolute;top:0;transform-origin:top left;transform:rotate(90deg)}
.spage{display:flex;flex-wrap:wrap;align-content:flex-start;overflow:visible;break-after:page;page-break-after:always;position:relative}
.spage:last-child{break-after:auto;page-break-after:auto}
.cell{flex:none;position:relative;overflow:hidden;break-inside:avoid;page-break-inside:avoid}
.cell.outl::after{content:'';position:absolute;inset:0;border:.1mm dashed #8a8a8a;pointer-events:none}
@media print{
  html,body{background:#fff!important;margin:0!important;padding:0!important}
  body>*:not(#printRoot){display:none!important}
  #printRoot{position:static!important;left:auto!important}
  .no-print{display:none!important}
}
@media (max-width:980px){
  .lay{grid-template-columns:1fr}.lay-pv{position:static}
  .pgrid{grid-template-columns:1fr}.cols2{grid-template-columns:1fr}
  .top-in{flex-wrap:wrap}
}

/* ---------- быстрый ввод и правка в таблице ---------- */
.quick{padding:14px 16px;margin-bottom:12px}
.q-t{font-weight:700;font-size:13px;margin-bottom:10px}
.q-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.q-f label.l{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.q-f .inp{font-size:16px;font-weight:600;padding:9px 11px}
.inp.cell{border-color:transparent;background:transparent;padding:7px 9px;font-weight:600;font-variant-numeric:tabular-nums}
.inp.cell:hover{border-color:var(--line2)}
.inp.cell:focus{background:var(--card)}
.inp.cell.bad{color:var(--bad);border-color:var(--bad)}
.btn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.done:hover{filter:brightness(1.08);color:#fff;border-color:var(--ok)}
.seg .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:99px;font-size:11px;background:color-mix(in srgb,currentColor 16%,transparent);text-align:center}
td .bcwarn{margin:0 0 0 9px}
.inp.qin{border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:9px 11px;outline:none;width:100%}
.inp.qin:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}

.pill{border:0;border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--line);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.hide{display:none}

/* ---------- маркировка ЧЗ ---------- */
.chz-grid{display:grid;grid-template-columns:280px 1fr;gap:18px;align-items:start}
.chz-list{overflow:hidden}
.chz-b{padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.chz-b:hover{background:var(--acc-soft)}
.chz-b.on{background:var(--acc-soft);box-shadow:inset 3px 0 0 var(--acc)}
.chz-b .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:5px;border-radius:9px;background:var(--line);margin-top:7px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}
.chz-stat{font-size:15px}
.chz-stat b{font-size:20px}
.tag.chz .b-sz{font-variant-numeric:tabular-nums}
@media (max-width:980px){.chz-grid{grid-template-columns:1fr}}

</style>
<style id="pageStyle"></style>
</head>

/* ---------------------------------------------------------------- подгонка текста по размеру */
function fitAll(root) {
  const els = $$('[data-fit]', root);
  els.filter(e => e.dataset.fit !== 'price').forEach(fitEl);
  els.filter(e => e.dataset.fit === 'price').forEach(fitPrice);
  // этикетки ЧЗ: если текст (название + размер) не помещается рядом с кодом по высоте — уменьшаем шрифты вместе
  $$('.chz-text', root).forEach(box => {
    const kids = $$('[data-fit]', box); let g = 0;
    while (box.scrollHeight > box.clientHeight + 0.5 && g++ < 40) kids.forEach(k => { k.style.fontSize = (parseFloat(k.style.fontSize) * 0.95) + 'pt'; });
  });
}
function fitEl(el) {
  const mode = el.dataset.fit; let size = parseFloat(el.dataset.size) || 8, g = 0;
  el.style.fontSize = size + 'pt';
  if (mode === 'w') {
    while (el.scrollWidth > el.clientWidth + 0.5 && size > 2.5 && g++ < 80) { size *= 0.96; el.style.fontSize = size + 'pt'; }
  } else if (mode.startsWith('lines:')) {
    const n = +mode.split(':')[1];
    const over = () => { const lh = parseFloat(getComputedStyle(el).lineHeight) || size * 1.33; return el.scrollHeight > lh * n + 1 || el.scrollWidth > el.clientWidth + 0.5; };
    while (over() && size > 2.5 && g++ < 80) { size *= 0.96; el.style.fontSize = size + 'pt'; }
  }
}
function fitPrice(el) {
  const box = el.parentElement; let size = parseFloat(el.dataset.size) || 40, g = 0;
  const maxK = (parseFloat(el.dataset.stretch) || 100) / 100;
  el.style.transform = '';
  el.style.fontSize = size + 'pt';
  const bad = () => el.offsetWidth > box.clientWidth + 0.5 || el.offsetHeight > box.clientHeight + 0.5;
  while (bad() && size > 4 && g++ < 120) { size *= 0.97; el.style.fontSize = size + 'pt'; }
  // цифры растягиваются вверх, пока есть свободное место (но не больше заданного максимума)
  if (maxK > 1.01 && el.offsetHeight > 0) {
    const k = Math.min(maxK, box.clientHeight / el.offsetHeight);

const FIELD_LABELS = { '': '— пропустить —', item: '№ (item)', name: 'Название', price: 'Цена', oldPrice: 'Старая цена', barcode: 'Штрихкод', brand: 'Бренд', composition: 'Состав', article: 'Артикул/модель', country: 'Страна', qty: 'Количество' };
const HEADER_RX = [
  ['oldPrice', /стар|old|было|до скид/i], ['barcode', /штрих|barcode|^шк$|ean|баркод/i], ['price', /цен|price|стоим|сумм/i],
  ['composition', /состав|compos|материал/i], ['article', /артикул|article|модель|model/i], ['brand', /бренд|brand|марка|производит/i],
  ['country', /стран|country/i], ['qty', /^кол|qty|шт|колич/i], ['item', /^item|^№|номер|^код|^id$|^sku/i], ['name', /назв|наимен|name|товар|описан/i],
];
function parseDelimited(text) {
  text = text.replace(/\r\n?/g, '\n').replace(/^﻿/, '');
  const first = text.split('\n').find(l => l.trim()) || '';
  const cnt = ch => (first.match(new RegExp(ch === '\t' ? '\t' : '\\' + ch, 'g')) || []).length;
  const delim = cnt('\t') ? '\t' : cnt(';') >= cnt(',') && cnt(';') ? ';' : cnt(',') ? ',' : '\t';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"' && !cur) q = true;
    else if (ch === delim) { row.push(cur); cur = ''; }
    else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  row.push(cur); rows.push(row);
  return rows.filter(r => r.some(c => String(c).trim()));
}
function guessHeader(r0) { let hits = 0; r0.forEach(c => { if (HEADER_RX.some(([, rx]) => rx.test(String(c).trim()))) hits++; }); return hits >= 2 || (hits >= 1 && r0.every(c => isNaN(parseFloat(String(c).replace(',', '.'))))); }
function guessMap(r0, hasHeader) {
  const used = new Set(), map = [];
  if (hasHeader) r0.forEach(c => { const h = String(c).trim(); const f = (HEADER_RX.find(([k, rx]) => rx.test(h) && !used.has(k)) || [''])[0]; if (f) used.add(f); map.push(f); });
  else { const order = ['item', 'name', 'price', 'barcode', 'oldPrice', 'brand', 'composition', 'article', 'country', 'qty']; r0.forEach((c, i) => map.push(order[i] || '')); }
  return map;
}

function loadQrFile(f) {
  if (!f) return;
  if (!/^image\//.test(f.type)) { toast('Нужен файл-картинка (PNG, JPG, SVG)'); return; }
  if (f.size > 4 * 1024 * 1024) { toast('Файл слишком большой (больше 4 МБ)'); return; }
  const r = new FileReader();
  r.onload = () => {
    const src = r.result;
    const img = new Image();
    img.onload = () => {
      let out = src, pix = img.naturalWidth > 0 && img.naturalWidth < 400;
      if (f.type !== 'image/svg+xml' && Math.max(img.naturalWidth, img.naturalHeight) > 900) {
        // уменьшаем только крупные картинки, чтобы не раздувать память браузера
        const k = 900 / Math.max(img.naturalWidth, img.naturalHeight), cv = document.createElement('canvas');
        cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); out = cv.toDataURL('image/png'); pix = false;
      }
      const p = S.tpl['price-l'].blocks.promo; p.qrimg = out; p.qrpix = pix; p.qrsrc = 'img'; p.qr = true;
      save(); layTpl = 'price-l'; renderLayoutTab(); toast('QR загружен и сохранён в программе');
    };
    img.onerror = () => toast('Не удалось прочитать картинку');
    img.src = src;
  };
  r.readAsDataURL(f);
}

const FS_OK = typeof window.showSaveFilePicker === 'function' && typeof window.showOpenFilePicker === 'function';
const FS_TYPES = [{ description: 'Файл копии (JSON)', accept: { 'application/json': ['.json'] } }];
let fileHandle = null, filePerm = 'none', fileErr = '', fsTimer = 0, lastFileWrite = 0;
const LAST_BACKUP_KEY = 'kv_tags_last_backup';
function idbOpen() { return new Promise((res, rej) => { const r = indexedDB.open('kv_tags_fs', 1); r.onupgradeneeded = () => r.result.createObjectStore('h'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k) { const db = await idbOpen(); return new Promise((res, rej) => { const q = db.transaction('h').objectStore('h').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbSet(k, v) { const db = await idbOpen(); return new Promise((res, rej) => { const t = db.transaction('h', 'readwrite'); t.objectStore('h').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
async function idbDel(k) { const db = await idbOpen(); return new Promise((res, rej) => { const t = db.transaction('h', 'readwrite'); t.objectStore('h').delete(k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
function markBackup(ts) { try { localStorage.setItem(LAST_BACKUP_KEY, String(ts || Date.now())); } catch (e) {} renderFsPill(); }
function lastBackupTs() { try { return +localStorage.getItem(LAST_BACKUP_KEY) || 0; } catch (e) { return 0; } }
async function fsCheckPerm(request) {
  if (!fileHandle) { filePerm = 'none'; return; }
  try {
    let p = fileHandle.queryPermission ? await fileHandle.queryPermission({ mode: 'readwrite' }) : 'granted';
    if (p !== 'granted' && request && fileHandle.requestPermission) p = await fileHandle.requestPermission({ mode: 'readwrite' });
    filePerm = p === 'granted' ? 'granted' : 'prompt';
  } catch (e) { filePerm = 'error'; fileErr = e.message; }
}
function worthWriting() { return S.items.length > 0 || S.meta.touched; }
function fsSchedule() { if (!fileHandle) return; clearTimeout(fsTimer); fsTimer = setTimeout(() => fsWrite(false), 1500); }
async function fsWrite(force) {
  if (!fileHandle || filePerm !== 'granted') return false;
  if (!force && !worthWriting()) return false; // пустую «свежую» программу не пишем поверх файла с данными
  try {
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(S)); await w.close();
    lastFileWrite = Date.now(); fileErr = ''; markBackup(lastFileWrite); renderFsCard(); return true;
  } catch (e) { fileErr = e.message || String(e); filePerm = 'error'; renderFsPill(); renderFsCard(); return false; }
}
async function fsReadFile() {
  const f = await fileHandle.getFile(); const txt = await f.text();
  const raw = JSON.parse(txt);
  if (!raw || !Array.isArray(raw.items)) throw new Error('Это не файл копии программы');
  return raw;
}
function applyLoaded(raw) { S = normalizeState(raw); persistNow(); sel.clear(); layTpl = S.ui.tpl; route(S.ui.tab || 'items'); }
async function fsInit() {
  if (!FS_OK) { renderFsPill(); return; }
  try { fileHandle = (await idbGet('file')) || null; } catch (e) { fileHandle = null; }
  await fsCheckPerm(false);
  renderFsPill();
  if (fileHandle && filePerm === 'granted') fsCheckNewer();
}
async function fsCheckNewer() {
  try {
    const raw = await fsReadFile(); const fileAt = +(raw.meta && raw.meta.savedAt) || 0;
    if (fileAt > (S.meta.savedAt || 0) + 5000 && raw.items.length + Object.keys(raw.tpl || {}).length > 0) offerLoad(raw, fileAt);
  } catch (e) { /* файл пуст или недоступен — не мешаем */ }
}
function offerLoad(raw, fileAt) {
  const m = openModal(`<div class="mh"><h2>В файле копии данные новее</h2><button class="x">×</button></div>
    <div class="mb"><p>Файл «${esc(fileHandle ? fileHandle.name : '')}» обновлён <b>${fmtDate(fileAt)}</b> — позже, чем данные в этом браузере.</p>
      <p class="hint" style="margin-top:8px">В файле: позиций — <b>${raw.items.length}</b>. Сейчас в программе: позиций — <b>${S.items.length}</b>.</p>
      <p class="hint" style="margin-top:8px">Если вы работали на другом компьютере или это новая установка — загрузите данные из файла.</p></div>
    <div class="mf"><button class="btn" id="keep">Оставить текущие (перезапишут файл)</button><button class="btn pri" id="load">Загрузить из файла</button></div>`, 'sm');
  $('.x', m).onclick = $('#keep', m).onclick = closeModal;
  $('#load', m).onclick = () => { closeModal(); applyLoaded(raw); toast('Данные загружены из файла'); fsSchedule(); };
}
async function fsAttach(handle, mode) {
  fileHandle = handle; await idbSet('file', handle); await fsCheckPerm(true);
  if (filePerm !== 'granted') { toast('Нужно разрешить доступ к файлу'); renderFsPill(); renderFsCard(); return; }
  if (mode === 'create') { await fsWrite(true); toast('Файл копии создан — дальше он обновляется сам'); }
  else {
    let raw = null; try { raw = await fsReadFile(); } catch (e) { raw = null; }
    const hasFile = raw && (raw.items.length || Object.keys(raw.tpl || {}).length);
    if (hasFile && (S.items.length || S.meta.touched)) {
      const m = openModal(`<div class="mh"><h2>Файл уже содержит данные</h2><button class="x">×</button></div>
        <div class="mb"><p>В файле позиций: <b>${raw.items.length}</b>, сейчас в программе: <b>${S.items.length}</b>. Что сделать?</p></div>
        <div class="mf"><button class="btn danger" id="over">Перезаписать файл текущими данными</button><button class="btn pri" id="load">Загрузить данные из файла</button></div>`, 'sm');
      $('.x', m).onclick = closeModal;
      $('#over', m).onclick = async () => { closeModal(); await fsWrite(true); toast('Файл обновлён'); };

async function fsCreate() { try { const h = await window.showSaveFilePicker({ suggestedName: 'kivi-tags-копия.json', types: FS_TYPES }); await fsAttach(h, 'create'); } catch (e) { if (e.name !== 'AbortError') toast('Не удалось создать файл: ' + e.message); } }
async function fsConnect() { try { const [h] = await window.showOpenFilePicker({ types: FS_TYPES, multiple: false }); await fsAttach(h, 'open'); } catch (e) { if (e.name !== 'AbortError') toast('Не удалось открыть файл: ' + e.message); } }
async function fsLoadNow() {
  if (!fileHandle) return;
  await fsCheckPerm(true); if (filePerm !== 'granted') { renderFsPill(); renderFsCard(); return; }
  try { const raw = await fsReadFile(); if (confirm(`Загрузить из файла (позиций: ${raw.items.length})? Текущие данные в программе будут заменены.`)) { applyLoaded(raw); toast('Данные загружены из файла'); } }
  catch (e) { toast('Не удалось прочитать файл: ' + e.message); }
}
async function fsResume() { await fsCheckPerm(true); if (filePerm === 'granted') { await fsWrite(true); toast('Автокопия возобновлена'); } renderFsPill(); renderFsCard(); }
async function fsDetach() { fileHandle = null; filePerm = 'none'; clearTimeout(fsTimer); try { await idbDel('file'); } catch (e) {} renderFsPill(); renderFsCard(); toast('Автокопия отключена'); }
function renderFsPill() {
  const el = $('#fsPill'); if (!el) return;

  let cls = 'hide', txt = '', act = null;
  if (fileHandle && filePerm === 'granted') { cls = 'ok'; txt = lastFileWrite ? `Автокопия ✓ ${new Date(lastFileWrite).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}` : 'Автокопия включена'; act = () => route('data'); }
  else if (fileHandle && filePerm === 'prompt') { cls = 'warn'; txt = 'Автокопия на паузе — нажмите, чтобы разрешить'; act = fsResume; }

  else if ((S.items.length || S.meta.touched) && stale) { cls = 'warn'; txt = lastBackupTs() ? 'Резервной копии давно нет' : 'Нет резервной копии — настроить'; act = () => route('data'); }

    <div class="hint" style="margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn)"><b>Важно:</b> выберите файл в папке <b>OneDrive</b> (или Яндекс.Диск / Google Диск). Файл на самом диске <b>C:</b> не спасёт, если диск выйдет из строя — облачная папка спасёт.</div>
    ${fileHandle ? `<p class="hint">Файл: <b>${esc(fileHandle.name)}</b>${lastFileWrite ? ` · записан ${fmtDate(lastFileWrite)}` : ''}${fileErr ? `<br><span class="bcwarn">${esc(fileErr)}</span>` : ''}</p>` : ''}
    <div class="row2" style="margin-top:10px">
      ${fileHandle ? `${filePerm !== 'granted' ? '<button class="btn pri" id="fsResume">Разрешить и продолжить</button>' : ''}<button class="btn" id="fsLoad">Загрузить из файла</button><button class="btn" id="fsNow">Записать сейчас</button><button class="btn ghost danger" id="fsOff">Отключить</button>`

/* ---------------------------------------------------------------- вкладка «Данные» */

/* ---------------------------------------------------------------- маршрутизация / запуск */
function route(tab) {
  S.ui.tab = tab; saveQuiet();
  $$('.nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $$('.tab').forEach(t => t.classList.toggle('hide', t.id !== 'tab-' + tab));
  if (tab === 'items') renderItemsTab();
  if (tab === 'layout') renderLayoutTab();
  if (tab === 'print') renderPrintTab();

  if (tab === 'chz') renderChzTab();
  window.scrollTo(0, 0);
}
function init() {
  loadState();
  if (!storageOk) $('#banner').classList.remove('hide');
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  $('.nav').onclick = e => { const b = e.target.closest('button'); if (b) route(b.dataset.tab); };

/* =====================================================================
   Маркировка «Честный знак»: коды GS1 DataMatrix из файла, печать порциями,
   учёт напечатанного (каждый код — только один раз).
   ===================================================================== */
const GS = '\x1d';

function gtinOk(g) { if (!/^\d{14}$/.test(g)) return false; let t = 0; for (let i = 0; i < 13; i++) t += (+g[i]) * (i % 2 === 0 ? 3 : 1); return (10 - t % 10) % 10 === +g[13]; }

/* ---------- разбор строки файла ----------
   Серийный номер в кодах ЧЗ может содержать запятые, точки с запятой и кавычки, поэтому строку НЕЛЬЗЯ резать по разделителям CSV:
   код выделяется по структуре — 01(GTIN)21(серия)91(ключ)92(подпись) или 01..21..93(подпись).
   Хвосты фиксированной длины (ключ 4, подпись 44 / 4) считаются с конца строки. */
function chzNormalizeGs(s) {
  return s.replace(/^\]d2/i, '').replace(/<GS>|\{GS\}|\[GS\]|\(GS\)|\\x1d|\\u001d|␝|\^\]/gi, GS);
}
function chzStruct(s) {
  s = s.replace(/\x1d+$/, '');
  let m = /^01(\d{14})21([\s\S]+)\x1d?91([\s\S]{4})\x1d?92([\s\S]{44})$/.exec(s);
  if (m && m[2].indexOf(GS) < 0 && m[3].indexOf(GS) < 0 && m[4].indexOf(GS) < 0) {
    return { code: `01${m[1]}21${m[2]}${GS}91${m[3]}${GS}92${m[4]}`, gtin: m[1], serial: m[2], parts: [['91', m[3]], ['92', m[4]]], restored: !/\x1d/.test(s) };
  }
  m = /^01(\d{14})21([\s\S]+)\x1d?93([\s\S]{4})$/.exec(s);
  if (m && m[2].indexOf(GS) < 0 && m[3].indexOf(GS) < 0) {
    return { code: `01${m[1]}21${m[2]}${GS}93${m[3]}`, gtin: m[1], serial: m[2], parts: [['93', m[3]]], restored: !/\x1d/.test(s) };
  }

}
function chzParse(raw) {
  let s = String(raw).replace(/^﻿/, '').replace(/[\r\n]+$/, '');
  if (/^".*"$/s.test(s)) s = s.slice(1, -1).replace(/""/g, '"');
  s = chzNormalizeGs(s).replace(/^[\x1d\s]+/, '');
  const tries = [s, s.replace(/[\t;, ]+$/, ''), s.replace(/[\t;, \x1d]+$/, '')];
  for (const v of tries) { const r = chzStruct(v); if (r) { r.gtinOk = gtinOk(r.gtin); return r; } }
  if (/\d[.,]\d+E\+\d+/i.test(s)) return { error: 'excel' };
  return { error: 'format' };
}
// файл целиком → { ok:[{code,...}], dup:n, errors:[{line, reason, text}] }
function chzParseFile(text, existing) {
  const lines = String(text).replace(/^﻿/, '').split(/\r\n|\n|\r/);
  const seen = new Set(existing || []), ok = [], errors = []; let dup = 0, restored = 0, withGs = 0, badGtin = 0, empty = 0;
  lines.forEach((ln, i) => {
    if (!ln.replace(/[\t;, ]/g, '').length) { empty++; return; }
    const r = chzParse(ln);
    if (r.error) { errors.push({ line: i + 1, reason: r.error, text: ln.slice(0, 70) }); return; }
    if (seen.has(r.code)) { dup++; return; }
    seen.add(r.code); ok.push(r); if (r.restored) restored++; else withGs++; if (!r.gtinOk) badGtin++;
  });
  return { ok, dup, errors, restored, withGs, badGtin, total: lines.length - empty };
}
function chzExplain(r) { return `(01) ${r.gtin} · (21) ${r.serial} · ${r.parts.map(p => `(${p[0]}) ${p[0] === '92' ? p[1].slice(0, 10) + '…' : p[1]}`).join(' · ')}`; }

/* ---------- макет этикетки ---------- */
function chzGeom(c, n) {
  const b = c.blocks.dm, dot = 25.4 / S.print.dpi, q = Math.max(1, b.quiet || 2), total = n + 2 * q;
  const textMin = b.textMin || 11;
  const avail = b.layout === 'column' ? Math.min(c.w - 2 * c.pad, c.h - 2 * c.pad - textMin) : Math.min(c.h - 2 * c.pad, c.w - 2 * c.pad - textMin);
  let mod = b.dots > 0 ? b.dots * dot : Math.floor(avail / total / dot) * dot;
  if (mod < dot) mod = dot;
  return { mod, n, box: total * mod, sym: n * mod, quiet: q * mod, dotsPerModule: Math.round(mod / dot) };
}
function chzDm(c, code) {
  const e = DataMatrix.encode(code, { gs1: true });

}
function chzTagHTML(tplId, it, dm) {
  const c = S.tpl[tplId], B = c.blocks, col = B.dm.layout === 'column';
  let d = dm;
  if (!d) { try { d = chzDm(c, it.code); } catch (e) { return `<div class="tag" style="width:${c.w}mm;height:${c.h}mm;padding:${c.pad}mm"><div class="bar-err">${esc(e.message)}</div></div>`; } }
  const g = d.geom;
  const box = `<div class="dmbox" style="width:${g.box}mm;height:${g.box}mm;padding:${g.quiet}mm;box-sizing:border-box;flex:none;background:#fff">${d.svg}</div>`;
  const nameEl = B.name.show && it.name ? `<div class="blk t wrap2 b-name" data-fit="lines:${B.name.lines}" data-size="${B.name.size}" style="${bStyle(c, B.name, 'line-height:1.12;word-break:normal;overflow-wrap:normal;hyphens:none;')}">${esc(it.name)}</div>` : '';
  const sizeEl = B.size.show && it.size ? `<div class="blk t b-sz" data-fit="w" data-size="${B.size.size}" style="${bStyle(c, B.size)}">${esc((B.size.prefix ? B.size.prefix + ' ' : '') + it.size)}</div>` : '';
  const text = nameEl || sizeEl ? `<div class="chz-text" style="flex:1 1 0;min-width:0;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:center;gap:${c.gap}mm;overflow:hidden">${nameEl}${sizeEl}</div>` : '';
  const bd = c.border > 0 ? `border:${c.border}mm solid #000;` : '';
  return `<div class="tag chz" style="width:${c.w}mm;height:${c.h}mm;padding:${c.pad}mm;gap:${c.gap}mm;${bd}flex-direction:${col ? 'column' : 'row'};align-items:center;font-family:${fontCss(c.font)}">${box}${text}</div>`;
}
const CHZ_DEMO = { code: '0104610761939752215K5QnebpYmulH' + GS + '91EE12' + GS + '92oplGhOogjWZQNs4jqM9EhCAU6wK6J1qVRfgqJ3d+qgQ=', name: 'Футболка женская', size: '44' };
function chzSample(tplId) {
  const b = (S.chz.batches.find(x => x.id === S.ui.chzBatch) || S.chz.batches[0]);
  if (!b) return CHZ_DEMO;
  return { code: b.codes[Math.max(0, b.p.indexOf('0'))] || b.codes[0], name: b.name || CHZ_DEMO.name, size: b.size || CHZ_DEMO.size };
}

/* ---------- печатная форма для кодов партии ---------- */
function buildPrintChz(batch, idxs, tplId) {
  const c = S.tpl[tplId], root = $('#printRoot');
  root.innerHTML = '';
  const stage = document.createElement('div'); root.appendChild(stage);
  const byN = {}, parts = [];
  idxs.forEach(i => {
    const code = batch.codes[i], e = DataMatrix.encode(code, { gs1: true });
    if (!byN[e.size]) {
      const g = chzGeom(c, e.size);
      stage.innerHTML = chzTagHTML(tplId, { name: batch.name, size: batch.size }, { svg: '@@DM@@', geom: g, n: e.size }); fitAll(stage);
      byN[e.size] = { html: stage.innerHTML, g };
    }
    const t = byN[e.size];
    parts.push({ html: t.html.replace('@@DM@@', DataMatrix.svg(e, t.g.sym)), qty: 1 });
  });
  stage.remove();
  assemblePrint(parts, tplId);
}
function chzPrint(batch, idxs) {
  if (!idxs.length) { toast('Нет кодов для печати'); return; }
  const bad = idxs.filter(i => { try { DataMatrix.encode(batch.codes[i], { gs1: true }); return false; } catch (e) { return true; } });
  if (bad.length) { toast(`Код №${bad[0] + 1} слишком длинный для DataMatrix`); return; }
  closeModal();
  buildPrintChz(batch, idxs, batch.tpl);
  pendingMark = { chz: { batchId: batch.id, idx: idxs, tplId: batch.tpl }, total: idxs.length };
  setTimeout(() => { try { window.print(); } catch (e) { toast('Не удалось открыть окно печати'); } }, 150);
}
function chzSetPrinted(batch, idxs, v) {
  const a = batch.p.split(''); idxs.forEach(i => { a[i] = v ? '1' : '0'; }); batch.p = a.join('');
  save();
}
// после закрытия окна печати спрашиваем явно: для ЧЗ нельзя «молча» считать код напечатанным или нет
function chzConfirmPrinted(pm) {
  const b = S.chz.batches.find(x => x.id === pm.batchId); if (!b) return;
  const first = Math.min.apply(null, pm.idx) + 1, last = Math.max.apply(null, pm.idx) + 1;
  const m = openModal(`<div class="mh"><h2>Коды напечатаны?</h2></div>
    <div class="mb"><p>Партия «${esc(b.name || b.file)}», коды <b>№${first}–${last}</b> (${pm.idx.length} шт.).</p>
      <p class="hint" style="margin-top:8px">Если этикетки действительно напечатаны, отметьте — эти коды больше не будут предложены к печати, и дублей не будет. Если печать отменили или принтер завис — выберите «Нет».</p></div>
    <div class="mf"><button class="btn" id="no">Нет, не печаталось</button><button class="btn pri" id="yes">Да, напечатано</button></div>`, 'sm', () => {});
  $('#yes', m).onclick = () => { chzSetPrinted(b, pm.idx, true); closeModal(); renderChzTab(); toast(`Отмечено напечатанными: ${pm.idx.length} шт.`); };
  $('#no', m).onclick = () => { closeModal(); toast('Отметка не поставлена'); };
  setTimeout(() => $('#yes', m) && $('#yes', m).focus(), 40);
}

/* ---------- состояние ---------- */
function normChz(raw) {
  const out = { batches: [], names: {} };
  if (raw && raw.names && typeof raw.names === 'object') Object.keys(raw.names).forEach(g => { const n = raw.names[g]; if (n && typeof n === 'object') out.names[g] = { name: String(n.name || ''), size: String(n.size || '') }; });
  if (!raw || !Array.isArray(raw.batches)) return out;
  raw.batches.forEach(b => {
    if (!b || !Array.isArray(b.codes)) return;
    let p = typeof b.p === 'string' ? b.p : ''; while (p.length < b.codes.length) p += '0'; p = p.slice(0, b.codes.length);
    out.batches.push({ id: b.id || uid(), file: b.file || '', name: b.name || '', size: b.size || '', tpl: CHZ_IDS.includes(b.tpl) ? b.tpl : 'chz-40', codes: b.codes, p, created: b.created || Date.now() });
  });
  return out;
}

/* ---------- вкладка «Маркировка ЧЗ» ---------- */
let chzSelected = new Set(), chzPage = 0, chzQ = '';
function chzCurrent() { return S.chz.batches.find(b => b.id === S.ui.chzBatch) || null; }
function chzCounts(b) { let n = 0; for (let i = 0; i < b.p.length; i++) if (b.p[i] === '1') n++; return { done: n, total: b.codes.length, left: b.codes.length - n }; }
function renderChzTab() {
  const host = $('#tab-chz'); if (!host) return;
  if (!S.chz.batches.length) {
    host.innerHTML = `<div class="card empty" style="padding:50px 20px"><h3>Маркировка «Честный знак»</h3>
      <p>Загрузите файл с кодами маркировки (CSV или TXT) — программа сделает из них этикетки с кодом DataMatrix нужного размера<br>и будет следить, чтобы каждый код был напечатан только один раз.</p>
      <p style="margin-top:16px"><button class="btn pri" id="chzAdd">${ICON.down} Загрузить файл с кодами</button></p></div>`;
    $('#chzAdd').onclick = openChzImport; return;
  }
  if (!chzCurrent()) S.ui.chzBatch = S.chz.batches[0].id;
  const b = chzCurrent(), cn = chzCounts(b), c = S.tpl[b.tpl], next = Math.max(1, Math.min(+S.ui.chzN || 10, cn.left || 1));
  host.innerHTML = `<div class="chz-grid">
    <div class="card chz-list"><div style="padding:14px 16px;display:flex;align-items:center;gap:10px"><b style="flex:1">Партии кодов</b><button class="btn sm pri" id="chzAdd">${ICON.plus} Файл</button></div>
      ${S.chz.batches.map(x => { const k = chzCounts(x); const pc = k.total ? Math.round(k.done / k.total * 100) : 0; return `<div class="chz-b ${x.id === b.id ? 'on' : ''}" data-id="${x.id}"><div class="t">${esc(x.name || x.file || 'Партия')}</div><div class="hint">${esc(x.size ? 'размер ' + x.size + ' · ' : '')}напечатано ${k.done} из ${k.total}</div><div class="prog"><i style="width:${pc}%"></i></div></div>`; }).join('')}</div>
    <div>
      <div class="card grp"><h3>Что печатаем</h3>
        <div class="fgrid"><div class="fld"><label class="l">Название на этикетке</label><input class="inp" id="chzName" value="${esc(b.name)}" placeholder="Футболка женская"></div>
          <div class="fld"><label class="l">Размер</label><input class="inp" id="chzSize" value="${esc(b.size)}" placeholder="44"></div>
          <div class="fld"><label class="l">Этикетка</label><div class="seg" id="chzTpl">${CHZ_IDS.map(id => `<button data-t="${id}" class="${b.tpl === id ? 'on' : ''}">${esc(S.tpl[id].short)}</button>`).join('')}</div></div></div></div>
      <div class="card grp" style="display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center">
        <div class="pv-stage" id="chzPv" style="margin:0;min-width:230px"></div>
        <div>
          <div class="chz-stat"><b>${cn.done}</b> напечатано · <b>${cn.left}</b> осталось · всего ${cn.total}</div>
          <div class="row2" style="margin:12px 0 6px"><span>Напечатать следующие</span><input class="inp qbig" id="chzN" type="number" min="1" max="${Math.max(1, cn.left)}" value="${next}" style="width:110px;font-size:22px;padding:8px"><span>шт.</span></div>
          <div class="chips" style="margin-bottom:12px">${[1, 5, 10, 25, 50, 100].map(n => `<button class="btn sm chzq" data-n="${n}">${n}</button>`).join('')}</div>
          <div class="row2"><button class="btn pri" id="chzGo" ${cn.left ? '' : 'disabled'}>${ICON.print} Печатать</button><span class="hint" id="chzRange"></span></div>
          <div class="hint" style="margin-top:10px" id="chzInfo"></div>
        </div></div>
      <div class="card" style="margin-top:14px"><div class="bar" style="padding:12px 14px;margin:0"><b>Коды</b>
        <div class="search" style="max-width:240px">${ICON.search}<input class="inp" id="chzQ" placeholder="Поиск по коду" value="${esc(chzQ)}"></div><span style="flex:1"></span>
        <span class="hint" id="chzSelInfo"></span><button class="btn sm" id="chzPrintSel" disabled>Печать выбранных</button><button class="btn sm" id="chzUnmark" disabled>Снять отметку</button><button class="btn sm danger" id="chzDelBatch">Удалить партию</button></div>
        <div class="tbl-wrap" style="max-height:420px"><table><thead><tr><th style="width:34px"><input type="checkbox" id="chzAll" style="accent-color:var(--acc)"></th><th>№</th><th>Код</th><th>Статус</th></tr></thead><tbody id="chzRows"></tbody></table></div><div class="more" id="chzPager"></div></div>
    </div></div>`;
  $('#chzAdd').onclick = openChzImport;
  $$('.chz-b', host).forEach(el => el.onclick = () => { S.ui.chzBatch = el.dataset.id; chzSelected.clear(); chzPage = 0; saveQuiet(); renderChzTab(); });
  $('#chzName').oninput = e => { b.name = e.target.value; chzRemember(b); save(); chzPreview(); };
  $('#chzSize').oninput = e => { b.size = e.target.value; chzRemember(b); save(); chzPreview(); };
  $('#chzTpl').onclick = e => { const x = e.target.closest('button'); if (!x) return; b.tpl = x.dataset.t; save(); renderChzTab(); };
  const nIn = $('#chzN'); const upd = () => { const n = Math.max(1, Math.min(parseInt(nIn.value, 10) || 1, cn.left || 1)); S.ui.chzN = n; saveQuiet(); chzRange(b, n); };
  nIn.oninput = upd; nIn.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#chzGo').click(); } };
  $$('.chzq').forEach(x => x.onclick = () => { nIn.value = x.dataset.n; upd(); nIn.focus(); });
  $('#chzGo').onclick = () => { const n = Math.max(1, parseInt(nIn.value, 10) || 1); chzPrint(b, nextIdx(b, n)); };
  $('#chzQ').oninput = e => { chzQ = e.target.value.trim(); chzPage = 0; chzRows(b); };
  $('#chzAll').onchange = e => { chzVisible(b).slice(chzPage * 100, chzPage * 100 + 100).forEach(i => e.target.checked ? chzSelected.add(i) : chzSelected.delete(i)); chzRows(b); };
  $('#chzPrintSel').onclick = () => {
    const idx = Array.from(chzSelected).sort((a, z) => a - z);
    if (idx.some(i => b.p[i] === '1') && !confirm('Среди выбранных есть уже напечатанные коды. Печатать их повторно?')) return;
    chzPrint(b, idx);
  };
  $('#chzUnmark').onclick = () => { const idx = Array.from(chzSelected); chzSetPrinted(b, idx, false); chzSelected.clear(); renderChzTab(); };
  $('#chzDelBatch').onclick = () => { if (confirm(`Удалить партию «${b.name || b.file}» (${cn.total} кодов)? Данные об отметках тоже пропадут.`)) { S.chz.batches = S.chz.batches.filter(x => x.id !== b.id); S.ui.chzBatch = ''; save(); renderChzTab(); } };
  chzPreview(); chzRange(b, next); chzRows(b);
}
function chzGtin(b) { const c = b.codes[0] || ''; return /^01\d{14}/.test(c) ? c.slice(2, 16) : ''; }
function chzRemember(b) { const g = chzGtin(b); if (!g) return; S.chz.names = S.chz.names || {}; S.chz.names[g] = { name: b.name, size: b.size }; }
function nextIdx(b, n) { const out = []; for (let i = 0; i < b.codes.length && out.length < n; i++) if (b.p[i] === '0') out.push(i); return out; }
function chzRange(b, n) {
  const idx = nextIdx(b, n), el = $('#chzRange'); if (!el) return;
  el.textContent = idx.length ? `будут напечатаны коды №${idx[0] + 1}${idx.length > 1 ? '–' + (idx[idx.length - 1] + 1) : ''}` : 'все коды напечатаны';
}
function chzPreview() {
  const b = chzCurrent(), host = $('#chzPv'); if (!b || !host) return;
  const idx = b.p.indexOf('0'), code = b.codes[idx >= 0 ? idx : 0];
  const c = S.tpl[b.tpl];
  mountTag(host, b.tpl, { code, name: b.name, size: b.size }, autoZoom(b.tpl, 250, 250));
  let info = '';
  try { const e = DataMatrix.encode(code, { gs1: true }), g = chzGeom(c, e.size); info = `Код DataMatrix ${e.size}×${e.size} модулей · модуль ${(g.mod).toFixed(2)} мм (${g.dotsPerModule} точек принтера) · сам код ${(g.sym).toFixed(1)} мм`; } catch (e) { info = e.message; }
  const el = $('#chzInfo'); if (el) el.textContent = info;
}
function chzVisible(b) {
  const out = []; const q = chzQ.toLowerCase();
  for (let i = 0; i < b.codes.length; i++) if (!q || b.codes[i].toLowerCase().includes(q)) out.push(i);
  return out;
}
function chzRows(b) {
  const vis = chzVisible(b), pages = Math.max(1, Math.ceil(vis.length / 100)); chzPage = Math.min(chzPage, pages - 1);
  const slice = vis.slice(chzPage * 100, chzPage * 100 + 100), tb = $('#chzRows'); if (!tb) return;
  tb.innerHTML = slice.map(i => { const c = b.codes[i].replace(/\x1d/g, '␝'); const done = b.p[i] === '1';
    return `<tr data-i="${i}" class="${done ? 'printed' : ''}"><td><input type="checkbox" ${chzSelected.has(i) ? 'checked' : ''} style="accent-color:var(--acc)"></td><td class="itemno">${i + 1}</td><td style="font-family:ui-monospace,Consolas,monospace;font-size:12px">${esc(c.length > 44 ? c.slice(0, 26) + '…' + c.slice(-12) : c)}</td><td>${done ? '<span class="chip ok">✓ напечатан</span>' : '<span class="chip">не напечатан</span>'}</td></tr>`; }).join('');
  $$('tr', tb).forEach(tr => { $('input', tr).onchange = e => { const i = +tr.dataset.i; e.target.checked ? chzSelected.add(i) : chzSelected.delete(i); chzSelInfo(); }; });
  $('#chzPager').innerHTML = pages > 1 ? `<button class="btn sm" id="pgP" ${chzPage ? '' : 'disabled'}>←</button> <span class="muted">стр. ${chzPage + 1} из ${pages} · кодов ${vis.length}</span> <button class="btn sm" id="pgN" ${chzPage < pages - 1 ? '' : 'disabled'}>→</button>` : `<span class="muted">кодов: ${vis.length}</span>`;
  const p = $('#pgP'), n = $('#pgN'); if (p) p.onclick = () => { chzPage--; chzRows(b); }; if (n) n.onclick = () => { chzPage++; chzRows(b); };
  chzSelInfo();
}
function chzSelInfo() { const n = chzSelected.size; const a = $('#chzSelInfo'); if (!a) return; a.textContent = n ? `Выбрано: ${n}` : ''; $('#chzPrintSel').disabled = !n; $('#chzUnmark').disabled = !n; }

/* ---------- загрузка файла ---------- */
function openChzImport() {
  const m = openModal(`<div class="mh"><h2>Загрузка кодов маркировки</h2><button class="x">×</button></div>
    <div class="mb"><p class="hint" style="margin-bottom:10px">Выберите исходный файл с кодами (CSV/TXT), как вам его прислали. <b>Не пересохраняйте его через Excel</b> — Excel портит длинные коды (обрезает цифры). Можно и вставить коды из буфера, но надёжнее файл.</p>
      <div class="row2"><input type="file" id="chzFile" accept=".csv,.txt,.tsv,text/plain,text/csv" class="hide"><button class="btn pri" id="chzPick">${ICON.down} Выбрать файл…</button><span class="muted" id="chzFn"></span></div>
      <textarea class="txa" id="chzTxt" style="margin-top:10px;min-height:90px;font-family:ui-monospace,Consolas,monospace;font-size:12px" placeholder="…или вставьте коды сюда, по одному в строке"></textarea>
      <div id="chzSum" style="margin-top:12px"></div>
      <div class="fgrid" style="margin-top:12px"><div class="fld"><label class="l">Название партии</label><input class="inp" id="chzPName"></div><div class="fld"><label class="l">Название на этикетке</label><input class="inp" id="chzIName" placeholder="Футболка женская"></div><div class="fld"><label class="l">Размер</label><input class="inp" id="chzISize" placeholder="44"></div></div><div class="hint" id="chzKnown" style="margin-top:6px">Название и размер в код не входят — введите один раз, программа запомнит их для этого товара (по GTIN).</div></div>
    <div class="mf"><span class="muted" id="chzCnt"></span><span class="sp"></span><button class="btn" id="mCancel">Отмена</button><button class="btn pri" id="chzDo" disabled>Добавить партию</button></div>`);
  let parsed = null, fname = '';
  const existing = new Set(); S.chz.batches.forEach(b => b.codes.forEach(c => existing.add(c)));
  const run = () => {
    const txt = $('#chzTxt', m).value; if (!txt.trim()) { parsed = null; $('#chzSum', m).innerHTML = ''; $('#chzDo', m).disabled = true; return; }
    parsed = chzParseFile(txt, existing);
    const p = parsed, ex = p.ok[0], dupAll = p.dup;
    const exc = p.errors.filter(e => e.reason === 'excel').length, fmt = p.errors.length - exc;
    $('#chzSum', m).innerHTML = `<div class="card" style="padding:12px 14px;box-shadow:none">
      <div><b>Строк с кодами: ${p.total}</b> · корректных: <b style="color:var(--ok)">${p.ok.length}</b>${dupAll ? ` · повторов (пропущено): <b>${dupAll}</b>` : ''}${p.errors.length ? ` · с ошибкой: <b style="color:var(--bad)">${p.errors.length}</b>` : ''}</div>
      ${ex ? `<div class="hint" style="margin-top:6px">Как прочитан первый код: ${esc(chzExplain(ex))}</div>` : ''}
      ${p.ok.length ? `<div class="hint" style="margin-top:4px">Разделители групп (GS): были в ${p.withGs} кодах${p.restored ? `, восстановлены по структуре в ${p.restored}` : ''}.${p.badGtin ? ` <span class="bcwarn">GTIN с неверной контрольной цифрой: ${p.badGtin}</span>` : ''}</div>` : ''}
      ${exc ? `<div class="hint" style="margin-top:6px;color:var(--bad)"><b>${exc}</b> строк испорчены Excel (цифры обрезаны, вид «1,04611E+17») — их восстановить нельзя. Возьмите исходный файл от поставщика.</div>` : ''}
      ${fmt ? `<div class="hint" style="margin-top:6px;color:var(--bad)">Не распознан формат в ${fmt} строках, например строка ${p.errors.find(e => e.reason === 'format').line}: <code>${esc(p.errors.find(e => e.reason === 'format').text)}</code></div>` : ''}</div>`;
    $('#chzDo', m).disabled = !p.ok.length; $('#chzCnt', m).textContent = p.ok.length ? `К добавлению: ${p.ok.length}` : '';
    if (!$('#chzPName', m).value) $('#chzPName', m).value = fname.replace(/\.[^.]+$/, '');
    const known = ex && S.chz.names && S.chz.names[ex.gtin];
    if (known && !$('#chzIName', m).value && !$('#chzISize', m).value) { $('#chzIName', m).value = known.name; $('#chzISize', m).value = known.size; $('#chzKnown', m).textContent = 'Название и размер подставлены из прошлой загрузки этого товара (по GTIN).'; }
  };
  $('#chzPick', m).onclick = () => $('#chzFile', m).click();
  $('#chzFile', m).onchange = e => { const f = e.target.files[0]; if (!f) return; fname = f.name; $('#chzFn', m).textContent = f.name; const r = new FileReader(); r.onload = () => { $('#chzTxt', m).value = r.result; run(); }; r.readAsText(f, 'utf-8'); };
  $('#chzTxt', m).oninput = run;
  $('.x', m).onclick = $('#mCancel', m).onclick = closeModal;
  $('#chzDo', m).onclick = () => {
    if (!parsed || !parsed.ok.length) return;
    const b = { id: uid(), file: fname, name: $('#chzIName', m).value.trim(), size: $('#chzISize', m).value.trim(), tpl: 'chz-40', codes: parsed.ok.map(x => x.code), p: '0'.repeat(parsed.ok.length), created: Date.now() };
    b.file = $('#chzPName', m).value.trim() || fname || 'Партия';
    chzRemember(b); S.chz.batches.push(b); S.ui.chzBatch = b.id; chzSelected.clear(); chzPage = 0; save(); closeModal(); renderChzTab(); toast(`Добавлено кодов: ${b.codes.length}`);
  };
}

document.addEventListener('DOMContentLoaded', init);
