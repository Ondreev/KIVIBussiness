<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="icon" type="image/png" href="/favicon.ico">
  <meta charset="UTF-8" />
  <title>KIVI Business</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <!-- CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" defer></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --ink: #0f172a;
      --sub: #64748b;
      --faint: #94a3b8;
      --line: rgba(15, 23, 42, 0.07);
      --indigo: #6366f1;
      --violet: #a855f7;
      --green: #10b981;
      --red: #ef4444;
      --amber: #f59e0b;
      --card-shadow: 0 10px 30px rgba(15, 23, 42, 0.07), 0 2px 8px rgba(15, 23, 42, 0.04);
      --radius: 22px;
    }

    body {
      margin: 0;
      background: #eef0f6;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overscroll-behavior: none;
      scroll-behavior: smooth;
      overflow-x: hidden;
      font-variant-numeric: tabular-nums;
    }

    /* Воздушный фон с цветными подсветками (iOS aurora) */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(640px 420px at 88% -6%, rgba(99, 102, 241, 0.16), transparent 62%),
        radial-gradient(540px 400px at -12% 22%, rgba(168, 85, 247, 0.12), transparent 62%),
        radial-gradient(720px 520px at 55% 112%, rgba(14, 165, 233, 0.11), transparent 62%);
    }

    /* === АНИМАЦИИ === */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseRing {
      0%   { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.35); }
      70%  { box-shadow: 0 0 0 9px rgba(99, 102, 241, 0); }
      100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
    }

    @keyframes fillX {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }

    @keyframes counterUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Каскадное появление карточек */
    .left-column > *, .right-column > *, .container > * {
      animation: fadeInUp 0.55s ease-out both;
    }
    .left-column > *:nth-child(2), .right-column > *:nth-child(2) { animation-delay: 0.06s; }
    .left-column > *:nth-child(3), .right-column > *:nth-child(3) { animation-delay: 0.12s; }
    .left-column > *:nth-child(4), .right-column > *:nth-child(4) { animation-delay: 0.18s; }
    .left-column > *:nth-child(5), .right-column > *:nth-child(5) { animation-delay: 0.24s; }
    .left-column > *:nth-child(n+6), .right-column > *:nth-child(n+6) { animation-delay: 0.3s; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* === ШАПКА: тонкая, стеклянная, липкая === */
    .logo-wrapper {
      position: sticky;
      top: 0;
      z-index: 50;
      width: 100%;
      background: rgba(255, 255, 255, 0.72);
      -webkit-backdrop-filter: blur(20px) saturate(1.8);
      backdrop-filter: blur(20px) saturate(1.8);
      border-bottom: 1px solid var(--line);
      padding: 12px 16px;
      display: flex;
      justify-content: center;
    }

    h1 {
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 900;
      margin: 0;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--indigo), var(--violet));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }
    h1 span {
      font-weight: 400;
    }

    /* === ОСНОВНОЙ WRAPPER === */
    .container {
      width: 100%;
      max-width: 640px;
      padding: 14px 12px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ДЕСКТОПНАЯ ВЕРСИЯ */
    @media (min-width: 768px) {
      .container {
        max-width: 1320px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        padding: 24px;
      }
    }

    .left-column,
    .right-column {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }

    @media (min-width: 768px) {
      .left-column, .right-column { gap: 20px; }
    }

    .right-column:empty {
      display: none;
    }

    /* ============================================
       ДИЗАЙН-СИСТЕМА КАРТОЧЕК
       ============================================ */
    .card-light {
      background: #fff;
      color: var(--ink);
      border-radius: var(--radius);
      padding: 18px 16px;
      width: 100%;
      box-sizing: border-box;
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(255, 255, 255, 0.7);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      overflow-wrap: break-word;
      min-width: 0;
    }

    .card-light:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.1), 0 4px 12px rgba(15, 23, 42, 0.05);
    }

    .card-dark {
      background: linear-gradient(160deg, #171e2e 0%, #232c40 100%);
      color: #fff;
      border-radius: var(--radius);
      padding: 18px 16px;
      width: 100%;
      box-sizing: border-box;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.32);
      border: 1px solid rgba(255, 255, 255, 0.07);
      overflow-wrap: break-word;
      min-width: 0;
    }

    .card-title {
      font-size: clamp(18px, 4.6vw, 22px);
      font-weight: 800;
      text-align: center;
      margin-bottom: 12px;
      letter-spacing: -0.4px;
    }

    .card-subtitle {
      font-size: clamp(12px, 3.2vw, 14px);
      color: var(--sub);
      text-align: center;
      margin: -8px 0 14px;
    }

    .card-dark .card-subtitle { color: rgba(255, 255, 255, 0.6); }

    .chip {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
      vertical-align: middle;
    }

    /* === СВОДКА: ПЛАН / ФАКТ / РЕКОРД === */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      background: #fff;
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .cell {
      border-radius: 16px;
      text-align: center;
      padding: 14px 6px 12px;
      transition: transform 0.2s ease;
      min-width: 0;
      overflow: hidden;
    }

    .cell:active { transform: scale(0.97); }

    /* Тонировка рядов: план / факт / рекорд */
    .cell:nth-child(-n+3) { background: #eef2ff; }
    .cell:nth-child(-n+3) .small { color: #6366f1; }
    .cell:nth-child(n+4):nth-child(-n+6) { background: #ecfdf5; }
    .cell:nth-child(n+4):nth-child(-n+6) .small { color: #059669; }
    .cell:nth-child(n+7) { background: #fffbeb; }
    .cell:nth-child(n+7) .small { color: #d97706; }

    .big {
      font-size: clamp(16px, 4.6vw, 28px);
      font-weight: 850;
      color: var(--ink);
      margin-bottom: 4px;
      letter-spacing: -0.6px;
      white-space: nowrap;
    }

    .small {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .big.counting { animation: counterUp 0.3s ease-out; }

    .record-date {
      font-size: 9px;
      color: var(--faint);
      font-weight: 600;
      margin-top: -2px;
      margin-bottom: 2px;
    }

    /* === ГРАФИК 7 ДНЕЙ === */
    #chartContainer {
      background: #fff;
      border-radius: var(--radius);
      padding: 16px 14px 12px;
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    canvas {
      width: 100% !important;
      height: 150px !important;
    }

    .custom-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      gap: 4px;
    }

    .label-item {
      text-align: center;
      flex: 1;
      min-width: 0;
    }

    .revenue {
      font-size: clamp(11px, 2.9vw, 13px);
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .date {
      font-size: clamp(10px, 2.6vw, 12px);
      font-weight: 600;
      color: var(--faint);
      margin-top: 2px;
    }

    /* === ОРАКУЛ: цель дня + тайм-слоты === */
    .oracle-progress-wrap {
      margin-bottom: 16px;
    }

    .oracle-progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 13px;
      color: var(--sub);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .oracle-progress-meta b {
      color: var(--ink);
      font-size: 16px;
      font-weight: 800;
    }

    .oracle-bar {
      height: 12px;
      border-radius: 999px;
      background: #eef1f7;
      overflow: hidden;
    }

    .oracle-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--indigo), var(--violet));
      transform-origin: left;
      animation: fillX 0.9s ease-out both;
    }

    .oracle-slot {
      background: #f8fafc;
      border: 1px solid #eef2f7;
      border-radius: 16px;
      padding: 13px 14px;
      margin-bottom: 9px;
    }

    .oracle-slot:last-child { margin-bottom: 0; }

    .oracle-slot.done {
      background: #ecfdf5;
      border-color: #bbf2db;
    }

    .oracle-slot.now {
      background: #eef2ff;
      border-color: rgba(99, 102, 241, 0.55);
      animation: pulseRing 2.2s ease-out infinite;
    }

    .oracle-slot-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px 8px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .oracle-chips {
      display: inline-flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .oracle-time {
      font-size: clamp(14px, 3.8vw, 16px);
      font-weight: 800;
      color: var(--ink);
      white-space: nowrap;
    }

    .oracle-target {
      font-size: clamp(16px, 4.4vw, 19px);
      font-weight: 850;
      color: var(--ink);
      white-space: nowrap;
    }

    .oracle-slot.done .oracle-target { color: #059669; }

    .oracle-slot-sub {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: clamp(11px, 3vw, 12.5px);
      color: var(--sub);
      font-weight: 600;
    }

    .chip-now { background: var(--indigo); color: #fff; }
    .chip-peak { background: #fef3c7; color: #b45309; }
    .chip-done { background: #d1fae5; color: #047857; }

    /* === ИСТОРИЯ ВЫРУЧКИ === */
    .history-block {
      background: #fff;
      border-radius: var(--radius);
      padding: 18px 14px;
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(255, 255, 255, 0.7);
      content-visibility: auto;
    }

    .history-block h2 {
      font-size: clamp(18px, 4.6vw, 22px);
      font-weight: 800;
      text-align: center;
      margin-bottom: 12px;
      letter-spacing: -0.4px;
    }

    /* === БЛОК СРАВНЕНИЯ === */
    .compare-block {
      background: #fff;
      color: var(--ink);
      border-radius: var(--radius);
      padding: 18px 14px;
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(255, 255, 255, 0.7);
      content-visibility: auto;
    }

    .compare-block h2 {
      font-size: clamp(17px, 4.4vw, 20px);
      font-weight: 800;
      text-align: center;
      margin-bottom: 12px;
      letter-spacing: -0.4px;
    }

    #compareTable table {
      width: 100%;
      border-collapse: collapse;
      font-size: clamp(12px, 3.2vw, 13.5px);
    }

    #compareTable th,
    #compareTable td {
      padding: 10px 6px;
      border-bottom: 1px solid #f1f5f9;
      text-align: center;
    }

    #compareTable th {
      background: transparent;
      border-bottom: 2px solid #eef2f7;
      font-weight: 800;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--faint);
    }

    .hidden-row { display: none; }

    .highlight {
      background: #ecfdf5;
      font-weight: 700;
    }

    /* Кнопка */
    button {
      background: linear-gradient(135deg, var(--indigo), var(--violet));
      color: white;
      border: none;
      padding: 13px 24px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
      width: 100%;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(99, 102, 241, 0.4);
    }

    button:active { transform: translateY(0) scale(0.98); }

    /* === СЛЕДУЮЩИЕ 3 МЕСЯЦА: градиентные карточки === */
    .next3-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .next3-item {
      border-radius: 18px;
      padding: 16px 12px;
      text-align: center;
      min-width: 0;
      color: #fff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.28);
      transition: transform 0.2s ease;
    }

    .next3-item:hover { transform: translateY(-3px) scale(1.02); }

    .next3-item::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(120px 70px at 80% -10%, rgba(255, 255, 255, 0.35), transparent 70%);
      pointer-events: none;
    }

    .next3-item--1 { background: linear-gradient(150deg, #6366f1, #8b5cf6); }
    .next3-item--2 { background: linear-gradient(150deg, #8b5cf6, #d946ef); box-shadow: 0 8px 20px rgba(168, 85, 247, 0.28); }
    .next3-item--3 { background: linear-gradient(150deg, #0ea5e9, #6366f1); box-shadow: 0 8px 20px rgba(14, 165, 233, 0.28); }

    .next3-month {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 6px;
    }

    .next3-value {
      font-size: clamp(19px, 5.2vw, 26px);
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      white-space: nowrap;
    }

    .next3-sub {
      font-size: clamp(10px, 2.8vw, 12px);
      font-weight: 600;
      color: rgba(255, 255, 255, 0.8);
    }

    /* Мобильная версия: карточки-строки, крупная цифра справа */
    @media (max-width: 480px) {
      .next3-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .next3-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        text-align: left;
        padding: 16px;
      }

      .next3-month { margin-bottom: 0; flex: 0 0 auto; font-size: 13px; }
      .next3-meta { text-align: right; min-width: 0; }
      .next3-value { margin-bottom: 2px; font-size: clamp(21px, 6vw, 26px); }
    }

    /* === МИНИ-БЛОКИ (всегда 2 колонки) === */
    .mini-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
      gap: 10px;
      width: 100%;
    }

    .mini-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    .mini-card {
      background: #fff;
      color: var(--ink);
      border-radius: 18px;
      padding: 14px 12px;
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(255, 255, 255, 0.7);
      min-width: 0;
      overflow-wrap: anywhere;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .mini-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.1);
    }

    .mini-title {
      font-weight: 800;
      margin-bottom: 8px;
      text-align: center;
      font-size: clamp(13px, 3.4vw, 15px);
    }

    .mini-value {
      font-size: clamp(19px, 5.4vw, 26px);
      font-weight: 900;
      text-align: center;
      white-space: nowrap;
      letter-spacing: -0.5px;
    }

    .mini-label {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--faint);
    }

    /* === ТЕПЛОВАЯ КАРТА МЕСЯЦА === */
    .hm-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
      margin-bottom: 12px;
    }

    .hm-wd {
      font-size: 11px;
      font-weight: 800;
      color: var(--faint);
      text-align: center;
      padding: 4px 0;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .hm-day {
      aspect-ratio: 1;
      border-radius: 11px;
      display: grid;
      place-items: center;
      position: relative;
      font-size: clamp(13px, 3.6vw, 16px);
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      min-width: 0;
      /* лёгкий глянец */
      background-image: linear-gradient(145deg, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0) 60%);
    }

    .hm-day:hover { transform: scale(1.1); box-shadow: 0 4px 14px rgba(15, 23, 42, 0.18); z-index: 2; }

    /* день с отличной выручкой мягко светится */
    .hm-day.hot { box-shadow: 0 3px 12px rgba(16, 185, 129, 0.35); }

    .hm-day.today {
      outline: 2.5px solid var(--indigo);
      outline-offset: 1.5px;
      animation: pulseRing 2.2s ease-out infinite;
      font-weight: 900;
    }

    /* Бейдж выполнения плана: ✓ / ✕ */
    .hm-mark {
      position: absolute;
      top: -5px;
      right: -5px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9.5px;
      font-weight: 900;
      color: #fff;
      border: 1.5px solid #fff;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.25);
      z-index: 2;
      pointer-events: none;
    }

    .hm-mark.win { background: linear-gradient(135deg, #10b981, #34d399); }
    .hm-mark.miss { background: linear-gradient(135deg, #f87171, #ef4444); }

    .hm-dots {
      position: absolute;
      bottom: 4px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 4px;
      pointer-events: none;
    }

    /* платёж — светящийся ромб, день рождения — светящаяся точка */
    .hm-dot {
      width: 6px;
      height: 6px;
    }

    .hm-dot--pay {
      background: linear-gradient(135deg, #f59e0b, #f97316);
      border-radius: 2px;
      transform: rotate(45deg);
      box-shadow: 0 0 6px rgba(249, 115, 22, 0.65);
    }

    .hm-dot--bday {
      background: linear-gradient(135deg, #a855f7, #d946ef);
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(168, 85, 247, 0.65);
    }

    /* На десктопе ячейки крупнее — метки тоже */
    @media (min-width: 768px) {
      .hm-grid { gap: 7px; }
      .hm-day { font-size: 18px; border-radius: 14px; }
      .hm-mark { width: 19px; height: 19px; font-size: 11px; top: -6px; right: -6px; }
      .hm-dot { width: 8px; height: 8px; }
      .hm-dots { bottom: 6px; gap: 5px; }
    }

    .hm-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 6px 14px;
      margin-bottom: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--sub);
    }

    .hm-legend i {
      display: inline-block;
      width: 11px;
      height: 11px;
      border-radius: 4px;
      margin-right: 4px;
      vertical-align: -1px;
      font-style: normal;
    }

    /* === ПРОГНОЗ ПО ДНЯМ === */
    .fc-strip {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 14px;
    }

    .fc-day {
      aspect-ratio: 1;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      cursor: pointer;
      position: relative;
      min-width: 0;
      font-weight: 800;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      background-image: linear-gradient(145deg, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0) 60%);
    }

    .fc-day:hover { transform: scale(1.09); z-index: 2; }
    .fc-day.sel { outline: 2px solid var(--indigo); outline-offset: 1.5px; }

    .fc-day .n {
      font-size: clamp(13px, 3.6vw, 16px);
      line-height: 1.1;
    }

    .fc-day .w {
      font-size: 9px;
      font-weight: 800;
      opacity: 0.72;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .fc-day.peak {
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.45);
      animation: pulseRing 2.4s ease-out infinite;
    }

    .fc-day .fc-ev {
      position: absolute;
      top: 2px;
      right: 4px;
      font-size: 8px;
      line-height: 1;
      opacity: 0.9;
    }

    @media (min-width: 768px) {
      .fc-strip { gap: 7px; }
      .fc-day { border-radius: 14px; }
      .fc-day .n { font-size: 17px; }
      .fc-day .w { font-size: 10px; }
    }

    .fc-key {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px 10px;
      padding: 10px 12px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid #eef2f7;
      margin-bottom: 7px;
      flex-wrap: wrap;
    }

    .fc-key.up {
      background: linear-gradient(135deg, #eef2ff, #faf5ff);
      border-color: #e0e7ff;
    }

    .fc-key.down {
      background: #fff;
      border-color: #f1f5f9;
    }

    .fc-key-date {
      font-size: clamp(13px, 3.5vw, 15px);
      font-weight: 800;
      color: var(--ink);
      white-space: nowrap;
    }

    .fc-key-val {
      font-size: clamp(13px, 3.5vw, 15px);
      font-weight: 850;
      white-space: nowrap;
      margin-left: auto;
    }

    .fc-key-val.up { color: #4f46e5; }
    .fc-key-val.down { color: var(--faint); }

    .fc-tags {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      width: 100%;
    }

    .fc-tag {
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      background: #eef2ff;
      color: #4f46e5;
      letter-spacing: 0.2px;
    }

    .fc-tag.warm { background: #fef3c7; color: #b45309; }
    .fc-tag.cool { background: #f1f5f9; color: #64748b; }

    .fc-tip {
      background: linear-gradient(135deg, #fffbeb, #fff7ed);
      border: 1px solid #fde68a;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: clamp(12px, 3.2vw, 13.5px);
      color: #92400e;
      font-weight: 600;
      margin-top: 10px;
      line-height: 1.45;
    }

    .fc-detail {
      font-size: clamp(12px, 3.2vw, 13px);
      color: var(--sub);
      text-align: center;
      margin-top: 10px;
      min-height: 18px;
      font-weight: 600;
    }

    .fc-section {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--faint);
      margin: 12px 0 8px;
      text-align: center;
    }

    /* === СОВЕТНИК ДНЯ === */
    .adv-metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .adv-metric {
      background: #f8fafc;
      border: 1px solid #eef2f7;
      border-radius: 14px;
      padding: 10px 6px;
      text-align: center;
      min-width: 0;
    }

    .adv-metric b {
      display: block;
      font-size: clamp(16px, 4.4vw, 20px);
      font-weight: 900;
      color: var(--ink);
      white-space: nowrap;
    }

    .adv-metric span {
      font-size: 9.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--faint);
    }

    .adv-focus {
      background: linear-gradient(135deg, #eef2ff, #faf5ff);
      border: 1px solid #e0e7ff;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .adv-focus-label {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #4f46e5;
      margin-bottom: 5px;
    }

    .adv-focus-title {
      font-size: clamp(15px, 4vw, 17px);
      font-weight: 850;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .adv-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .adv-list li {
      font-size: clamp(12.5px, 3.3vw, 13.5px);
      color: #475569;
      font-weight: 600;
      padding: 3px 0 3px 16px;
      position: relative;
      line-height: 1.45;
    }

    .adv-list li::before {
      content: '•';
      position: absolute;
      left: 4px;
      color: #818cf8;
      font-weight: 900;
    }

    .adv-goals {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }

    .adv-goal {
      background: #f8fafc;
      border: 1px solid #eef2f7;
      border-radius: 14px;
      padding: 10px 12px;
      min-width: 0;
    }

    .adv-goal .t {
      font-size: 9.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--faint);
      margin-bottom: 3px;
    }

    .adv-goal .v {
      font-size: clamp(15px, 4vw, 18px);
      font-weight: 900;
      color: var(--ink);
      white-space: nowrap;
    }

    .adv-goal .p {
      font-size: 11.5px;
      color: #059669;
      font-weight: 800;
      margin-top: 2px;
    }

    .adv-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      padding: 8px 2px;
      border-bottom: 1px solid #f1f5f9;
      font-size: clamp(12.5px, 3.3vw, 13.5px);
      color: var(--sub);
      font-weight: 600;
    }

    .adv-row b { color: var(--ink); white-space: nowrap; }
    .adv-row .up { color: #059669; }
    .adv-row .down { color: #ef4444; }

    .adv-tip {
      background: linear-gradient(135deg, #fffbeb, #fff7ed);
      border: 1px solid #fde68a;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: clamp(12.5px, 3.3vw, 13.5px);
      color: #92400e;
      font-weight: 600;
      margin: 10px 0;
      line-height: 1.5;
    }

    details.adv-more {
      border-top: 1px solid #f1f5f9;
      margin-top: 8px;
      padding-top: 4px;
    }

    details.adv-more summary {
      cursor: pointer;
      font-weight: 800;
      font-size: 13px;
      color: #4f46e5;
      padding: 8px 2px;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
    }

    details.adv-more summary::-webkit-details-marker { display: none; }

    details.adv-more summary::after {
      content: '▾';
      transition: transform 0.25s ease;
      color: var(--faint);
    }

    details.adv-more[open] summary::after { transform: rotate(180deg); }

    /* Адаптация для самых маленьких экранов */
    @media (max-width: 360px) {
      .container { padding: 12px 10px 24px; }
      .grid { gap: 6px; padding: 10px; }
      .cell { padding: 12px 4px 10px; }
    }
  </style>
</head>
<body>
  <!-- ЛОГОТИП -->
  <div class="logo-wrapper">
    <h1>KIVI <span>Business</span></h1>
  </div>

  <div class="container">
    <!-- ===== ЛЕВАЯ КОЛОНКА ===== -->
    <div class="left-column">
      <!-- План/Факт/Рекорд -->
      <div class="grid" id="summaryBlock">
        <div class="cell"><div class="big" id="planTo">0₽</div><div class="small">План ТО</div></div>
        <div class="cell"><div class="big" id="planTraffic">0 чел.</div><div class="small">План ТР</div></div>
        <div class="cell"><div class="big" id="planAvg">0₽</div><div class="small">План СР ЧЕК</div></div>

        <div class="cell"><div class="big" id="factTo">—</div><div class="small">Факт ТО</div></div>
        <div class="cell"><div class="big" id="factTraffic">—</div><div class="small">Факт ТР</div></div>
        <div class="cell"><div class="big" id="factAvg">—</div><div class="small">Факт СР ЧЕК</div></div>

        <div class="cell">
          <div class="big" id="recordTo">—</div>
          <div class="record-date" id="recordToDate"></div>
          <div class="small">Рекорд ТО</div>
        </div>
        <div class="cell">
          <div class="big" id="recordTraffic">—</div>
          <div class="record-date" id="recordTrafficDate"></div>
          <div class="small">Рекорд ТР</div>
        </div>
        <div class="cell"><div class="big" id="comparePrev">—</div><div class="small">прошл. год</div></div>
      </div>

      <!-- График -->
      <div id="chartContainer">
        <canvas id="salesChart"></canvas>
        <div id="customLabels" class="custom-labels"></div>
      </div>

      <!-- Сравнение -->
      <div class="compare-block">
        <h2>В сравнении с прошлым годом</h2>
        <div id="compareTable"></div>
        <button id="toggleRowsBtn" type="button">Показать все</button>
      </div>

      <!-- История выручки -->
      <div class="history-block">
        <h2>📊 История выручки</h2>
        <div id="historyYears"></div>
      </div>

      <!-- Остальные блоки добавятся сюда динамически -->
    </div>

    <!-- ===== ПРАВАЯ КОЛОНКА ===== -->
    <div class="right-column">
      <!-- СЮДА вставятся: heatmap → advisor → история -->
    </div>
  </div>

  <script>
    // === ЭФФЕКТ ПЕРЕСЧЁТА ЦИФР ===
    function animateCounter(element, finalValue, duration = 800) {
      if (!element || !finalValue) return;

      const isNumber = /^\d/.test(finalValue);
      if (!isNumber) {
        element.textContent = finalValue;
        return;
      }

      const numericValue = parseInt(finalValue.replace(/[^\d]/g, '')) || 0;
      const suffix = finalValue.replace(/[\d\s]/g, '');
      const startValue = 0;
      const startTime = performance.now();

      function update(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);

        const easeOutQuart = 1 - Math.pow(1 - progress, 4);
        const current = Math.floor(startValue + (numericValue - startValue) * easeOutQuart);

        element.textContent = current.toLocaleString('ru-RU') + suffix;
        element.classList.add('counting');

        if (progress < 1) {
          requestAnimationFrame(update);
        } else {
          element.classList.remove('counting');
        }
      }

      requestAnimationFrame(update);
    }

    // Переключатель строк
    let showingAll = false;
    function toggleRows() {
      if (!window.allDataRows || !window.allDataRows.length) return;
      showingAll = !showingAll;
      window.allDataRows.forEach((row, i) => {
        if (row && row.classList) row.classList.toggle('hidden-row', !showingAll && i >= 6);
      });
      const btn = document.getElementById('toggleRowsBtn');
      if (btn) btn.textContent = showingAll ? 'Скрыть' : 'Показать все';
    }
    document.getElementById('toggleRowsBtn')?.addEventListener('click', toggleRows);

    // Убираем оверлеи
    document.addEventListener('sheets-ready', () => {
      ['#loadingOverlay', '#loadingIndicator', '#loading', '#loader', '#preloader',
       '.loadingOverlay', '.loading-indicator', '.loading', '.loader', '.preloader'
      ].forEach(sel => document.querySelectorAll(sel).forEach(el => el.remove()));

      // 🔧 АВТОМАТИЧЕСКИЙ ПЕРЕНОС БЛОКОВ В ПРАВУЮ КОЛОНКУ
      // Ждём 500ms чтобы все блоки успели создаться
      setTimeout(() => {
        const rightCol = document.querySelector('.right-column');
        if (!rightCol) return;

        // Переносим Карту месяца
        const heatmap = document.getElementById('heatmapMonth');
        if (heatmap && heatmap.parentElement?.classList.contains('left-column')) {
          rightCol.appendChild(heatmap);
        }

        // Переносим Советника дня
        const advisor = document.getElementById('advisorBlock');
        if (advisor && advisor.parentElement?.classList.contains('left-column')) {
          rightCol.appendChild(advisor);
        }
      }, 500);
    });

    window.animateCounter = animateCounter;
  </script>

  <!-- Скрипты -->
  <script src="config.js" defer></script>
  <script src="sheetsLoader.js" defer></script>
  <script src="kivi_dashboard_updated.js" defer></script>
  <script src="oracle.js" defer></script>
  <script src="history.js" defer></script>

  <!-- Доп. модули -->
  <script src="miniblocks.js" defer></script>
  <script src="heatmap.js" defer></script>
  <script src="advisor.js" defer></script>
  <script src="next3months.js" defer></script>
  <script src="forecast.js" defer></script>
  <script src="yearComparisonChart.js" defer></script>
  <script src="profitability.js" defer></script>
  <script src="purchase.js" defer></script>

  <!-- 🔧 АВТОМАТИЧЕСКИЙ ПЕРЕНОСЧИК БЛОКОВ (подключается ПОСЛЕДНИМ!) -->
  <script src="layoutFixer.js" defer></script>
</body>
</html>
